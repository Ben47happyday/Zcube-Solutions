# Render.com Blueprint — one web service, "zcube-solutions", built from the
# root Dockerfile. It runs two processes in the same container (see
# start.sh): the Flask app (company homepage, NAPLAN Prep Hub) bound to the
# public $PORT, and the Matchi Webportal Next.js app on an internal port
# that Flask reverse-proxies to at /solutions/matchihomeware (see
# matchihomeware_proxy in backend/app.py). Rename this service's display
# name to "Zcube-Solutions" in the dashboard (Settings > Name) if it was
# created under an older name — don't rename it by editing `name:` below,
# since that can make Render create a duplicate service instead.
#
# The database is deliberately NOT provisioned here: Render's free
# Postgres tier expires 30 days after creation. Pair this service with a
# free Supabase Postgres project instead — both the Flask app's own
# tables and Matchi Webportal's orders (kept in their own "matchihomeware"
# schema, so they don't collide) can live in the one database via
# DATABASE_URL below.
#
# To use: push this repo to GitHub, then in the Render dashboard choose
# "New > Blueprint" and point it at the repo. You'll be prompted for the
# `sync: false` vars below.
services:
  - type: web
    name: zcube-solutions
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: NOTIFY_EMAIL
        sync: false
      - key: MS_GRAPH_TENANT_ID
        sync: false
      - key: MS_GRAPH_CLIENT_ID
        sync: false
      - key: MS_GRAPH_CLIENT_SECRET
        sync: false
      - key: MS_GRAPH_SENDER_EMAIL
        sync: false
